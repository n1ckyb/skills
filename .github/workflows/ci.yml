name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check Git Diff
        run: git diff --check

      - name: Run Syntax Check
        run: npm run check

      - name: Validate Skill
        run: npm run skill:validate

      - name: Validate Plugin
        run: npm run plugin:validate

      - name: Run Tests
        env:
          SKILL_EXPLORER_ORIGIN: test
        run: npm test

      - name: Validate Operation Contracts
        run: npm run contract:validate

      - name: Validate Origin Separation
        run: npm run origin:validate

      - name: Run Production Diagnostics
        env:
          SKILL_EXPLORER_ORIGIN: production
        run: npm run diagnostics -- --prod

      - name: Run Development Diagnostics
        env:
          SKILL_EXPLORER_ORIGIN: development
        run: npm run diagnostics -- --dev

      - name: Run Test Diagnostics
        env:
          SKILL_EXPLORER_ORIGIN: test
        run: npm run diagnostics -- --test
